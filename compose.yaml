services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      MONGO_URI: mongodb://host.docker.internal:27017/ecommerce
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    ports:
      - "8080:80"
    restart: unless-stopped